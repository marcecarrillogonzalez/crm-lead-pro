<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Pro Seguimiento — Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e17; --panel:#111826; --panel2:#161f30; --border:#232d40;
    --cyan:#00d9ff; --cyan-dim:#0a8fa8; --text:#e6ecf5; --muted:#8b97ab;
    --danger:#ff5470; --success:#3ddc97; --warn:#ffb84d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Hanken Grotesk', sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh;
  }
  header{
    padding:12px 20px; border-bottom:1px solid var(--border); background:#0c121e;
    display:grid; grid-template-columns:minmax(260px,1fr) auto auto; align-items:center; gap:18px;
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand-logo{width:82px; height:55px; object-fit:contain; flex:0 0 auto;}
  .brand-copy{min-width:0;}
  .brand-copy strong{display:block; font-size:15px; line-height:1.15; font-weight:800; letter-spacing:-.02em;}
  .brand-copy span{display:block; margin-top:4px; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .brand-copy span b{color:var(--cyan); font-weight:700;}
  .close-counter{
    display:flex; align-items:center; gap:10px; min-width:176px; padding:8px 12px;
    border:1px solid var(--cyan-dim); border-radius:12px; background:rgba(0,217,255,.07);
  }
  .close-counter-value{font-size:27px; line-height:1; font-weight:800; color:var(--cyan); letter-spacing:-.03em;}
  .close-counter-copy{min-width:0;}
  .close-counter-copy strong{display:block; font-size:12px; line-height:1.15;}
  .close-counter-copy span{display:block; margin-top:3px; color:var(--muted); font-size:10px; white-space:nowrap;}
  .header-actions{display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap;}
  .header-actions select{
    background:var(--panel2); border:1px solid var(--border); color:var(--text); font-family:inherit;
    font-size:12px; padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  .carry-label{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); cursor:pointer; user-select:none;}
  .btn{
    background:var(--cyan); color:#04141a; border:none; padding:10px 18px;
    border-radius:8px; font-weight:700; cursor:pointer; font-size:14px;
  }
  .btn:hover{background:#33e3ff;}
  .btn:focus-visible,.header-actions select:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  .btn-ghost{
    background:transparent; color:var(--text); border:1px solid var(--border);
  }
  .metrics{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; padding:12px 20px 0;
  }
  .metric{
    background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:10px 14px;
  }
  .metric.accent{border-color:var(--cyan-dim);}
  .metric-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .metric-val{font-size:21px; font-weight:800;}
  @media (max-width: 720px){ .metrics{grid-template-columns:repeat(2, 1fr);} }
  .pending-shell{
    margin:16px 20px 0; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; overflow:hidden;
  }
  .pending-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:18px;
    padding:18px 18px 14px; border-bottom:1px solid var(--border);
  }
  .pending-head h2{font-size:20px; font-weight:800; letter-spacing:-.02em;}
  .pending-head p{font-size:13px; color:var(--muted); margin-top:4px;}
  .pending-head p strong{color:var(--text);}
  .pending-filters{display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end;}
  .pending-filter{
    border:1px solid var(--border); background:var(--panel2); color:var(--muted);
    border-radius:8px; padding:7px 10px; font:700 12px 'Hanken Grotesk',sans-serif;
    cursor:pointer;
  }
  .pending-filter:hover,.pending-filter:focus-visible{border-color:var(--cyan-dim); color:var(--text); outline:none;}
  .pending-filter.active{background:rgba(0,217,255,.12); border-color:var(--cyan-dim); color:var(--cyan);}
  .pending-list{background:var(--border);}
  .pending-item{
    width:100%; border:0; border-bottom:1px solid var(--border); background:var(--panel); color:var(--text); padding:10px 16px;
    display:grid; grid-template-columns:30px minmax(0,1fr) auto; align-items:center; gap:12px;
    text-align:left; cursor:pointer; font-family:inherit;
  }
  .pending-item:last-child{border-bottom:0;}
  .pending-item:hover,.pending-item:focus-visible{background:var(--panel2); outline:none;}
  .pending-number{
    width:26px; height:26px; display:grid; place-items:center; border-radius:8px;
    color:var(--cyan); background:rgba(0,217,255,.1); font-size:12px; font-weight:800;
  }
  .pending-person{min-width:0;}
  .pending-person strong{display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pending-person span{display:block; font-size:11px; color:var(--muted); margin-top:3px;}
  .pending-action{display:block; color:var(--text)!important; font-size:13px!important; font-weight:700; margin-top:0!important;}
  .pending-state,.followup-badge{
    display:inline-flex; align-items:center; gap:6px; border-radius:7px; padding:5px 8px;
    font-size:11px; font-weight:800;
  }
  .pending-state{white-space:nowrap;}
  .followup-badge{white-space:normal; line-height:1.3; overflow-wrap:anywhere;}
  .pending-state::before,.followup-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .followup-badge::before{flex:0 0 6px; margin-top:4px;}
  .is-overdue{color:#ff8797; background:rgba(255,84,112,.11);}
  .is-today{color:#ffd08c; background:rgba(255,184,77,.11);}
  .is-upcoming{color:#75e7ff; background:rgba(0,217,255,.1);}
  .is-unscheduled{color:#aab6c9; background:rgba(139,151,171,.1);}
  .pending-empty{grid-column:1/-1; background:var(--panel); color:var(--muted); text-align:center; padding:24px; font-size:13px;}
  .card .followup-badge{display:flex; width:100%; max-width:100%; margin-top:8px;}
  .board{
    display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:10px;
    width:100%; padding:14px 20px 20px; overflow-x:hidden;
  }
  .column{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    min-width:0; max-width:none; display:flex; flex-direction:column; max-height:calc(100vh - 110px);
  }
  .column-header{
    padding:11px 12px; border-bottom:1px solid var(--border); font-weight:700; font-size:11px;
    display:flex; justify-content:space-between; align-items:center; text-transform:uppercase; letter-spacing:0.04em;
  }
  .column-count{
    background:var(--panel2); color:var(--muted); border-radius:20px; padding:2px 9px; font-size:12px;
  }
  .column-body{padding:8px; overflow-y:auto; overflow-x:hidden; flex:1; display:flex; flex-direction:column; gap:8px;}
  .card{
    background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:9px 10px;
    cursor:grab; transition:border-color .15s;
  }
  .card:hover{border-color:var(--cyan-dim);}
  .card.dragging{opacity:.4;}
  .card h3{font-size:13px; font-weight:700; margin-bottom:3px;}
  .card p{font-size:11px; color:var(--muted); margin-bottom:2px;}
  .card .created-at{font-size:10px; color:#aeb9ca; margin:6px 0 0; padding-top:6px; border-top:1px solid var(--border);}
  .card .fuente{
    display:inline-block; margin-top:5px; font-size:10px; padding:2px 7px; border-radius:6px;
    background:rgba(0,217,255,.1); color:var(--cyan); font-weight:600;
  }
  .empty-state{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}
  .more-state{color:var(--muted); font-size:11px; text-align:center; padding:4px 0 2px; font-weight:700;}
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:24px;
  }
  .modal h2{font-size:18px; margin-bottom:18px;}
  .modal-created{font-size:12px; color:var(--muted); margin:-12px 0 18px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:9px 11px; border-radius:8px; font-family:inherit; font-size:14px;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end;}
  .btn-danger{background:var(--danger); color:#fff;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--panel2); border:1px solid var(--cyan);
    color:var(--text); padding:12px 18px; border-radius:10px; font-size:13px; z-index:200; display:none;
  }
  .toast.show{display:block;}
  @media (max-width:760px){
    header{grid-template-columns:1fr; gap:10px; padding:12px;}
    .brand-logo{width:74px; height:49px;}
    .close-counter{width:100%; justify-content:center;}
    .header-actions{justify-content:flex-start;}
    .pending-shell{margin:14px 12px 0;}
    .pending-head{display:block;}
    .pending-filters{justify-content:flex-start; margin-top:12px; overflow-x:auto; flex-wrap:nowrap;}
    .pending-list{grid-template-columns:1fr;}
    .pending-item{min-height:62px; grid-template-columns:28px minmax(0,1fr);}
    .pending-state{grid-column:2; justify-self:start;}
    .board{grid-template-columns:1fr; padding:14px 12px 88px;}
    .field input,.field select,.field textarea{font-size:16px;}
    .row2{grid-template-columns:1fr; gap:0;}
  }
  @media (min-width:761px) and (max-width:1050px){
    header{grid-template-columns:minmax(240px,1fr) auto;}
    .header-actions{grid-column:1/-1; justify-content:flex-end;}
    .board{grid-template-columns:repeat(4,minmax(0,1fr));}
  }
</style>
</head>

<script>
const DEMO_STORAGE_KEY = "lead-pro-demo-v3";

const ESTADOS = ["Nuevo lead","Contactado","No contesta","Llamada agendada","Propuesta enviada","Cerrado","Perdido"];
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
let leads = [];
let selMonth = new Date().toISOString().slice(0,7);
let pendingFilter = "today";

const FOLLOWUP_MARKER = /\n?\[\[LPF:([^\]]+)\]\]$/;

function followupMeta(l){
  const match = String(l.notas || "").match(FOLLOWUP_MARKER);
  if(!match) return {accion:"Contactar prospecto", hora:""};
  try{
    const value = JSON.parse(decodeURIComponent(match[1]));
    return {accion:value.accion || "Contactar prospecto", hora:value.hora || ""};
  } catch {
    return {accion:"Contactar prospecto", hora:""};
  }
}
function cleanNotes(value){ return String(value || "").replace(FOLLOWUP_MARKER, "").trim(); }
function notesWithFollowup(notes, accion, hora){
  const clean = cleanNotes(notes);
  if(!accion && !hora) return clean || null;
  const marker = `[[LPF:${encodeURIComponent(JSON.stringify({accion:accion || "Contactar prospecto", hora:hora || ""}))}]]`;
  return `${clean}${clean ? "\n" : ""}${marker}`;
}

function curMonth(){ return new Date().toISOString().slice(0,7); }
function leadMonth(l){ return (l.created_at || "").slice(0,7); }
function mLabel(k){ const p = k.split("-"); return MESES[+p[1]-1] + " " + p[0]; }

function updateCloseCounter(){
  const counter = document.getElementById("daysToClose");
  const label = document.getElementById("closeCounterLabel");
  const month = document.getElementById("closeCounterMonth");
  if(!counter || !label || !month) return;

  const now = new Date();
  month.textContent = `Cierre · ${new Intl.DateTimeFormat("es-CL", {month:"long", year:"numeric"}).format(now)}`;
  if(selMonth < curMonth()){
    counter.textContent = "✓";
    label.textContent = "mes cerrado";
    return;
  }

  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
  const daysLeft = Math.max(0, lastDay.getDate() - now.getDate());
  counter.textContent = daysLeft;
  label.textContent = daysLeft === 0 ? "cierre hoy" : daysLeft === 1 ? "día para el cierre" : "días para el cierre";
}

function isCarried(l){
  const chk = document.getElementById("carryChk");
  return selMonth === curMonth() && chk && chk.checked
    && leadMonth(l) && leadMonth(l) < curMonth()
    && l.estado !== "Cerrado" && l.estado !== "Perdido";
}
function monthLeads(){ return leads.filter(l => leadMonth(l) === selMonth); }
function visibleLeads(){ return leads.filter(l => leadMonth(l) === selMonth || isCarried(l)); }
function isClosed(l){ return l.estado === "Cerrado" || l.estado === "Perdido"; }
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function endOfWeekKey(){
  const d = new Date();
  const daysToSunday = (7 - d.getDay()) % 7;
  d.setDate(d.getDate() + daysToSunday);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function longTodayLabel(){
  const value = new Intl.DateTimeFormat("es-CL", {weekday:"long", day:"numeric", month:"long"}).format(new Date());
  return `Hoy es ${value}`;
}
function followupState(l){
  if(isClosed(l)) return null;
  if(!l.fecha_seguimiento) return "unscheduled";
  if(l.fecha_seguimiento < todayKey()) return "overdue";
  if(l.fecha_seguimiento === todayKey()) return "today";
  return "upcoming";
}
function followupLabel(l){
  const state = followupState(l);
  const meta = followupMeta(l);
  const hour = meta.hora ? ` · ${meta.hora}` : "";
  if(state === "overdue") return `Vencido · ${formatDate(l.fecha_seguimiento)}${hour}`;
  if(state === "today") return `Hoy${hour}`;
  if(state === "upcoming") return `${formatDate(l.fecha_seguimiento)}${hour}`;
  return "Sin seguimiento agendado";
}
function formatDate(value){
  if(!value) return "";
  const [y,m,d] = value.split("-");
  return `${d}/${m}/${y}`;
}
function formatLeadCreated(value){
  if(!value) return "Fecha de ingreso no disponible";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return "Fecha de ingreso no disponible";
  const datePart = new Intl.DateTimeFormat("es-CL", {weekday:"short", day:"numeric", month:"short"}).format(date).replace(/\./g, "");
  const timePart = new Intl.DateTimeFormat("es-CL", {hour:"2-digit", minute:"2-digit", hour12:false}).format(date);
  return `${datePart} · ${timePart}`;
}
function escapeHtml(value){
  return String(value ?? "").replace(/[&<>'"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[ch]);
}

function setPendingFilter(filter){
  pendingFilter = filter;
  document.querySelectorAll(".pending-filter").forEach(btn=>btn.classList.toggle("active", btn.dataset.filter===filter));
  renderPendings();
}

function renderPendings(){
  const active = leads.filter(l=>!isClosed(l));
  const groups = {overdue:[], today:[], upcoming:[], unscheduled:[], week:[]};
  active.forEach(l=>{
    const state = followupState(l);
    groups[state].push(l);
    if(l.fecha_seguimiento && l.fecha_seguimiento >= todayKey() && l.fecha_seguimiento <= endOfWeekKey()) groups.week.push(l);
  });
  const sortFollowups = (a,b)=>{
    const am = followupMeta(a), bm = followupMeta(b);
    return `${a.fecha_seguimiento||"9999"}T${am.hora||"23:59"}`.localeCompare(`${b.fecha_seguimiento||"9999"}T${bm.hora||"23:59"}`);
  };
  Object.values(groups).forEach(group=>group.sort(sortFollowups));
  ["today","week","overdue","unscheduled"].forEach(key=>document.getElementById(`p-${key}`).textContent = groups[key].length);
  document.getElementById("pending-title").textContent = longTodayLabel();
  const summary = document.getElementById("pendingSummary");
  summary.innerHTML = groups.today.length
    ? `<strong>${groups.today.length} ${groups.today.length === 1 ? "pendiente" : "pendientes"} para hoy.</strong> Abre cada tarea para registrar la gestión.`
    : `<strong>No tienes pendientes para hoy.</strong> Puedes revisar la semana o los vencidos.`;
  const list = document.getElementById("pendingList");
  const items = (groups[pendingFilter] || groups.today).slice(0,5);
  if(!items.length){
    const emptyCopy = pendingFilter === "overdue" ? "No tienes seguimientos vencidos." : pendingFilter === "today" ? "No tienes seguimientos para hoy." : pendingFilter === "week" ? "No hay seguimientos para el resto de esta semana." : "Todos los prospectos abiertos tienen fecha de seguimiento.";
    list.innerHTML = `<div class="pending-empty">${emptyCopy}</div>`;
    return;
  }
  list.innerHTML = items.map((l,index)=>`
    <button class="pending-item" type="button" data-lead-id="${escapeHtml(l.id)}">
      <span class="pending-number">${index + 1}</span>
      <span class="pending-person"><strong class="pending-action">${escapeHtml(followupMeta(l).accion)}</strong><span>${escapeHtml(l.nombre || "Sin nombre")}${l.telefono ? " · "+escapeHtml(l.telefono) : ""}</span></span>
      <span class="pending-state is-${followupState(l)}">${escapeHtml(followupLabel(l))}</span>
    </button>
  `).join("");
  list.querySelectorAll(".pending-item").forEach(item=>item.addEventListener("click",()=>openModal(leads.find(l=>String(l.id)===item.dataset.leadId))));
}

function buildMonthOptions(){
  const set = new Set(leads.map(leadMonth).filter(Boolean));
  set.add(curMonth());
  const arr = [...set].sort().reverse();
  if(!arr.includes(selMonth)) selMonth = arr[0];
  document.getElementById("monthSel").innerHTML = arr.map(k =>
    `<option value="${k}" ${k===selMonth?"selected":""}>${mLabel(k)}${k===curMonth()?" (actual)":""}</option>`
  ).join("");
}

async function req(path, method="GET", body=null){
  const stored = JSON.parse(localStorage.getItem(DEMO_STORAGE_KEY) || "[]");
  if(method === "GET") return stored.sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  if(method === "POST"){
    const row = {...body, id:(crypto.randomUUID ? crypto.randomUUID() : `demo-${Date.now()}`), created_at:new Date().toISOString()};
    stored.push(row);
    localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify(stored));
    return [row];
  }
  const id = decodeURIComponent((path.match(/id=eq\.([^&]+)/)||[])[1] || "");
  const index = stored.findIndex(item=>String(item.id)===String(id));
  if(method === "PATCH" && index >= 0) stored[index] = {...stored[index], ...body};
  if(method === "DELETE" && index >= 0) stored.splice(index,1);
  localStorage.setItem(DEMO_STORAGE_KEY, JSON.stringify(stored));
  return [];
}

async function loadLeads(){
  try{
    leads = await req("leads?select=*&order=created_at.desc") || [];
  } catch(error){
    console.error(error.details || error);
    showToast("No pudimos cargar tus leads. Revisa tu conexión.");
    return;
  }
  leads.forEach(l=>{
    if(l.estado === "Cerrado Nueva Masvida" || l.estado === "Cerrado otra isapre") l.estado = "Cerrado";
  });
  buildMonthOptions();
  updateMetrics();
  renderPendings();
  render();
}

function updateMetrics(){
  const ml = monthLeads();
  const cerr = ml.filter(l=>l.estado==="Cerrado");
  const total = ml.length, cerrados = cerr.length;
  const conv = total ? Math.round(cerrados/total*100) : 0;
  const uf = cerr.reduce((a,b)=>a+(parseFloat(b.valor_plan)||0),0);
  document.getElementById("m-total").textContent = total;
  document.getElementById("m-cerrados").textContent = cerrados;
  document.getElementById("m-conv").textContent = conv+"%";
  document.getElementById("m-uf").textContent = uf.toFixed(1)+" UF";
  updateCloseCounter();
}

function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  const vis = visibleLeads();
  ESTADOS.forEach(estado=>{
    const allItems = vis.filter(l=>l.estado===estado);
    const visibleLimit = estado === "Nuevo lead" ? 3 : 2;
    const items = allItems.slice(0,visibleLimit);
    const col = document.createElement("div");
    col.className = "column";
    col.innerHTML = `
      <div class="column-header">${estado} <span class="column-count">${allItems.length}</span></div>
      <div class="column-body" data-estado="${estado}"></div>
    `;
    const bodyEl = col.querySelector(".column-body");
    bodyEl.addEventListener("dragover", e=>e.preventDefault());
    bodyEl.addEventListener("drop", e=>onDrop(e, estado));
    if(items.length === 0){
      bodyEl.innerHTML = `<div class="empty-state">Sin leads</div>`;
    }
    items.forEach(l=>{
      const card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = l.id;
      card.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", l.id); card.classList.add("dragging"); });
      card.addEventListener("dragend", ()=>card.classList.remove("dragging"));
      card.addEventListener("click", ()=>openModal(l));
      card.innerHTML = `
        <h3>${escapeHtml(l.nombre || "Sin nombre")}</h3>
        <p>${escapeHtml(l.telefono || "")}</p>
        <p>${l.isapre_actual ? "Isapre actual: "+escapeHtml(l.isapre_actual) : ""}</p>
        <span class="fuente">${escapeHtml(l.fuente || "—")}</span>
        <p class="created-at">Ingresó · ${escapeHtml(formatLeadCreated(l.created_at))}</p>
        ${followupState(l) ? `<span class="followup-badge is-${followupState(l)}">${escapeHtml(followupMeta(l).accion)} · ${escapeHtml(followupLabel(l))}</span>` : ""}
      `;
      bodyEl.appendChild(card);
    });
    if(allItems.length > visibleLimit){
      const more = document.createElement("div");
      more.className = "more-state";
      more.textContent = `+${allItems.length - visibleLimit} prospectos más`;
      bodyEl.appendChild(more);
    }
    board.appendChild(col);
  });
}

async function onDrop(e, nuevoEstado){
  e.preventDefault();
  const id = e.dataTransfer.getData("text/plain");
  const lead = leads.find(l=>String(l.id)===String(id));
  if(!lead || lead.estado === nuevoEstado) return;
  const estadoAnterior = lead.estado;
  lead.estado = nuevoEstado;
  updateMetrics();
  renderPendings();
  render();
  try{
    await req(`leads?id=eq.${id}`, "PATCH", {estado: nuevoEstado});
    showToast("Estado actualizado");
  } catch(error){
    console.error(error.details || error);
    lead.estado = estadoAnterior;
    showToast("No pudimos cambiar el estado. Inténtalo nuevamente.");
    await loadLeads();
  }
}

function openModal(lead=null){
  document.getElementById("modalTitle").textContent = lead ? "Editar lead" : "Nuevo lead";
  const modalCreated = document.getElementById("modalCreated");
  modalCreated.hidden = !lead;
  modalCreated.textContent = lead ? `Ingresó: ${formatLeadCreated(lead.created_at)}` : "";
  document.getElementById("leadId").value = lead ? lead.id : "";
  document.getElementById("deleteBtn").style.display = lead ? "inline-block" : "none";
  const fields = ["nombre","telefono","email","isapre_actual","plan_actual","precio_actual","cargas","plan_tomado","valor_plan","fuente","fecha_seguimiento","clinica_preferente","presupuesto","estado"];
  fields.forEach(f=>{
    document.getElementById("f_"+f).value = lead && lead[f] != null ? lead[f] : (f==="fuente" ? "Meta Ads" : f==="estado" ? "Nuevo lead" : "");
  });
  const meta = lead ? followupMeta(lead) : {accion:"",hora:""};
  document.getElementById("f_accion_seguimiento").value = lead && lead.fecha_seguimiento ? meta.accion : "";
  document.getElementById("f_hora_seguimiento").value = meta.hora;
  document.getElementById("f_notas").value = lead ? cleanNotes(lead.notas) : "";
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }

async function saveLead(){
  const id = document.getElementById("leadId").value;
  const followupDate = document.getElementById("f_fecha_seguimiento").value || null;
  const followupAction = document.getElementById("f_accion_seguimiento").value.trim();
  const followupTime = document.getElementById("f_hora_seguimiento").value;
  const data = {
    nombre: document.getElementById("f_nombre").value || null,
    telefono: document.getElementById("f_telefono").value || null,
    email: document.getElementById("f_email").value || null,
    isapre_actual: document.getElementById("f_isapre_actual").value || null,
    plan_actual: document.getElementById("f_plan_actual").value || null,
    precio_actual: parseFloat(document.getElementById("f_precio_actual").value) || null,
    cargas: parseInt(document.getElementById("f_cargas").value) || null,
    plan_tomado: document.getElementById("f_plan_tomado").value || null,
    valor_plan: parseFloat(document.getElementById("f_valor_plan").value) || null,
    fuente: document.getElementById("f_fuente").value,
    fecha_seguimiento: followupDate,
    clinica_preferente: document.getElementById("f_clinica_preferente").value || null,
    presupuesto: parseFloat(document.getElementById("f_presupuesto").value) || null,
    estado: document.getElementById("f_estado").value,
    notas: notesWithFollowup(
      document.getElementById("f_notas").value,
      followupDate ? followupAction : "",
      followupDate ? followupTime : ""
    ),
  };
  if(!data.nombre){
    showToast("Escribe el nombre del prospecto.");
    document.getElementById("f_nombre").focus();
    return;
  }
  if((followupAction || followupTime) && !followupDate && !id){
    showToast("Elige la fecha del pendiente.");
    document.getElementById("f_fecha_seguimiento").focus();
    return;
  }
  try{
    if(id){
      await req(`leads?id=eq.${id}`, "PATCH", data);
      showToast("Lead y pendiente actualizados");
    } else {
      await req("leads", "POST", data);
      showToast("Lead creado y guardado");
    }
  } catch(error){
    console.error(error.details || error);
    showToast("No pudimos guardar. Revisa tu conexión e inténtalo nuevamente.");
    return;
  }
  closeModal();
  await loadLeads();
}

async function deleteLead(){
  const id = document.getElementById("leadId").value;
  if(!id) return;
  if(!confirm("¿Eliminar este lead?")) return;
  await req(`leads?id=eq.${id}`, "DELETE");
  closeModal();
  await loadLeads();
  showToast("Lead eliminado");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

seedDemo();
loadLeads();
</script>
