<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Paula — Leads Isapre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e17; --panel:#111826; --panel2:#161f30; --border:#232d40;
    --cyan:#00d9ff; --cyan-dim:#0a8fa8; --text:#e6ecf5; --muted:#8b97ab;
    --danger:#ff5470; --success:#3ddc97; --warn:#ffb84d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Hanken Grotesk', sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh;
  }
  header{
    padding:20px 28px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  header h1{font-size:20px; font-weight:800; letter-spacing:-0.02em;}
  header h1 span{color:var(--cyan);}
  .btn{
    background:var(--cyan); color:#04141a; border:none; padding:10px 18px;
    border-radius:8px; font-weight:700; cursor:pointer; font-size:14px;
  }
  .btn:hover{background:#33e3ff;}
  .btn-ghost{
    background:transparent; color:var(--text); border:1px solid var(--border);
  }
  .metrics{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; padding:16px 20px 4px;
  }
  .metric{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  }
  .metric.accent{border-color:var(--cyan-dim);}
  .metric-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .metric-val{font-size:24px; font-weight:800;}
  @media (max-width: 720px){ .metrics{grid-template-columns:repeat(2, 1fr);} }
  .board{
    display:flex; gap:14px; padding:20px; overflow-x:auto;
  }
  .column{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    min-width:280px; max-width:280px; display:flex; flex-direction:column; max-height:calc(100vh - 110px);
  }
  .column-header{
    padding:14px 16px; border-bottom:1px solid var(--border); font-weight:700; font-size:13px;
    display:flex; justify-content:space-between; align-items:center; text-transform:uppercase; letter-spacing:0.04em;
  }
  .column-count{
    background:var(--panel2); color:var(--muted); border-radius:20px; padding:2px 9px; font-size:12px;
  }
  .column-body{padding:10px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px;
    cursor:grab; transition:border-color .15s;
  }
  .card:hover{border-color:var(--cyan-dim);}
  .card.dragging{opacity:.4;}
  .card h3{font-size:14px; font-weight:700; margin-bottom:4px;}
  .card p{font-size:12px; color:var(--muted); margin-bottom:2px;}
  .card .fuente{
    display:inline-block; margin-top:6px; font-size:11px; padding:2px 8px; border-radius:6px;
    background:rgba(0,217,255,.1); color:var(--cyan); font-weight:600;
  }
  .empty-state{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:24px;
  }
  .modal h2{font-size:18px; margin-bottom:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:9px 11px; border-radius:8px; font-family:inherit; font-size:14px;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end;}
  .btn-danger{background:var(--danger); color:#fff;}
  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--panel2); border:1px solid var(--cyan);
    color:var(--text); padding:12px 18px; border-radius:10px; font-size:13px; z-index:200; display:none;
  }
  .toast.show{display:block;}
</style>
</head>
<body>

<header>
  <h1>CRM <span>Paula</span> — Leads Isapre</h1>
  <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
    <select id="monthSel" onchange="selMonth=this.value; updateMetrics(); render();" style="background:var(--panel2); border:1px solid var(--border); color:var(--text); font-family:inherit; font-size:13px; padding:8px 12px; border-radius:8px; cursor:pointer;"></select>
    <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; user-select:none;">
      <input type="checkbox" id="carryChk" checked onchange="render()" style="cursor:pointer;"> Arrastrar abiertos
    </label>
    <button class="btn" onclick="openModal()">+ Nuevo lead</button>
  </div>
</header>

<div class="metrics">
  <div class="metric"><div class="metric-label">Total leads</div><div class="metric-val" id="m-total">—</div></div>
  <div class="metric accent"><div class="metric-label">Cerrados</div><div class="metric-val" id="m-cerrados">—</div></div>
  <div class="metric"><div class="metric-label">Conversión</div><div class="metric-val" id="m-conv">—</div></div>
  <div class="metric"><div class="metric-label">UF cerrada</div><div class="metric-val" id="m-uf">—</div></div>
</div>

<div class="board" id="board"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nuevo lead</h2>
    <input type="hidden" id="leadId">
    <div class="field"><label>Nombre</label><input id="f_nombre"></div>
    <div class="row2">
      <div class="field"><label>Teléfono</label><input id="f_telefono"></div>
      <div class="field"><label>Email</label><input id="f_email"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Isapre actual</label><input id="f_isapre_actual"></div>
      <div class="field"><label>Plan actual</label><input id="f_plan_actual"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Precio actual (UF)</label><input id="f_precio_actual" type="number" step="0.01"></div>
      <div class="field"><label>Cargas</label><input id="f_cargas" type="number"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Plan tomado</label><input id="f_plan_tomado"></div>
      <div class="field"><label>Valor plan (UF)</label><input id="f_valor_plan" type="number" step="0.01"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Fuente</label>
        <select id="f_fuente">
          <option>Meta Ads</option><option>Google Ads</option><option>Referido</option>
          <option>Instagram orgánico</option><option>Otro</option>
        </select>
      </div>
      <div class="field"><label>Próximo seguimiento</label><input id="f_fecha_seguimiento" type="date"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Clínica preferente</label><input id="f_clinica_preferente"></div>
      <div class="field"><label>Presupuesto (UF)</label><input id="f_presupuesto" type="number" step="0.01"></div>
    </div>
    <div class="field"><label>Estado</label>
      <select id="f_estado">
        <option>Nuevo lead</option><option>Contactado</option><option>No contesta</option><option>Llamada agendada</option>
        <option>Propuesta enviada</option><option>Cerrado Nueva Masvida</option><option>Cerrado otra isapre</option><option>Perdido</option>
      </select>
    </div>
    <div class="field"><label>Notas</label><textarea id="f_notas"></textarea></div>
    <div class="modal-actions">
      <button class="btn-ghost btn" id="deleteBtn" style="display:none; background:transparent; border:1px solid var(--danger); color:var(--danger);" onclick="deleteLead()">Eliminar</button>
      <button class="btn-ghost btn" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="saveLead()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://qlcujkuvpomqrbevwqdb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsY3Vqa3V2cG9tcXJiZXZ3cWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjkxMjMsImV4cCI6MjEwMTk0NTEyM30.MJX-t-9R40YBzwkrtUdU6aqusS_QwV_gm2Ry_Il6ong";

const ESTADOS = ["Nuevo lead","Contactado","No contesta","Llamada agendada","Propuesta enviada","Cerrado Nueva Masvida","Cerrado otra isapre","Perdido"];
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
let leads = [];
let selMonth = new Date().toISOString().slice(0,7);

function curMonth(){ return new Date().toISOString().slice(0,7); }
function leadMonth(l){ return (l.created_at || "").slice(0,7); }
function mLabel(k){ const p = k.split("-"); return MESES[+p[1]-1] + " " + p[0]; }

function isCarried(l){
  const chk = document.getElementById("carryChk");
  return selMonth === curMonth() && chk && chk.checked
    && leadMonth(l) && leadMonth(l) < curMonth()
    && l.estado !== "Cerrado Nueva Masvida" && l.estado !== "Cerrado otra isapre" && l.estado !== "Perdido";
}
function monthLeads(){ return leads.filter(l => leadMonth(l) === selMonth); }
function visibleLeads(){ return leads.filter(l => leadMonth(l) === selMonth || isCarried(l)); }

function buildMonthOptions(){
  const set = new Set(leads.map(leadMonth).filter(Boolean));
  set.add(curMonth());
  const arr = [...set].sort().reverse();
  if(!arr.includes(selMonth)) selMonth = arr[0];
  document.getElementById("monthSel").innerHTML = arr.map(k =>
    `<option value="${k}" ${k===selMonth?"selected":""}>${mLabel(k)}${k===curMonth()?" (actual)":""}</option>`
  ).join("");
}

async function req(path, method="GET", body=null){
  const opts = {
    method,
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type":"application/json",
      "Prefer": method === "GET" ? "" : "return=representation"
    }
  };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, opts);
  if(method === "GET" || opts.headers.Prefer === "return=representation"){
    try{ return await res.json(); } catch{ return null; }
  }
  return null;
}

async function loadLeads(){
  leads = await req("leads?select=*&order=created_at.desc") || [];
  buildMonthOptions();
  updateMetrics();
  render();
}

function updateMetrics(){
  const ml = monthLeads();
  const cerr = ml.filter(l=>l.estado==="Cerrado Nueva Masvida" || l.estado==="Cerrado otra isapre");
  const total = ml.length, cerrados = cerr.length;
  const conv = total ? Math.round(cerrados/total*100) : 0;
  const uf = cerr.reduce((a,b)=>a+(parseFloat(b.valor_plan)||0),0);
  document.getElementById("m-total").textContent = total;
  document.getElementById("m-cerrados").textContent = cerrados;
  document.getElementById("m-conv").textContent = conv+"%";
  document.getElementById("m-uf").textContent = uf.toFixed(1)+" UF";
}

function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  const vis = visibleLeads();
  ESTADOS.forEach(estado=>{
    const items = vis.filter(l=>l.estado===estado);
    const col = document.createElement("div");
    col.className = "column";
    col.innerHTML = `
      <div class="column-header">${estado} <span class="column-count">${items.length}</span></div>
      <div class="column-body" data-estado="${estado}"></div>
    `;
    const bodyEl = col.querySelector(".column-body");
    bodyEl.addEventListener("dragover", e=>e.preventDefault());
    bodyEl.addEventListener("drop", e=>onDrop(e, estado));
    if(items.length === 0){
      bodyEl.innerHTML = `<div class="empty-state">Sin leads</div>`;
    }
    items.forEach(l=>{
      const card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.dataset.id = l.id;
      card.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", l.id); card.classList.add("dragging"); });
      card.addEventListener("dragend", ()=>card.classList.remove("dragging"));
      card.addEventListener("click", ()=>openModal(l));
      card.innerHTML = `
        <h3>${l.nombre || "Sin nombre"}</h3>
        <p>${l.telefono || ""}</p>
        <p>${l.isapre_actual ? "Isapre actual: "+l.isapre_actual : ""}</p>
        <span class="fuente">${l.fuente || "—"}</span>
      `;
      bodyEl.appendChild(card);
    });
    board.appendChild(col);
  });
}

async function onDrop(e, nuevoEstado){
  e.preventDefault();
  const id = e.dataTransfer.getData("text/plain");
  const lead = leads.find(l=>l.id===id);
  if(!lead || lead.estado === nuevoEstado) return;
  lead.estado = nuevoEstado;
  updateMetrics();
  render();
  await req(`leads?id=eq.${id}`, "PATCH", {estado: nuevoEstado});
  showToast("Estado actualizado");
}

function openModal(lead=null){
  document.getElementById("modalTitle").textContent = lead ? "Editar lead" : "Nuevo lead";
  document.getElementById("leadId").value = lead ? lead.id : "";
  document.getElementById("deleteBtn").style.display = lead ? "inline-block" : "none";
  const fields = ["nombre","telefono","email","isapre_actual","plan_actual","precio_actual","cargas","plan_tomado","valor_plan","fuente","fecha_seguimiento","clinica_preferente","presupuesto","estado","notas"];
  fields.forEach(f=>{
    document.getElementById("f_"+f).value = lead && lead[f] != null ? lead[f] : (f==="fuente" ? "Meta Ads" : f==="estado" ? "Nuevo lead" : "");
  });
  document.getElementById("modalOverlay").classList.add("open");
}
function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }

async function saveLead(){
  const id = document.getElementById("leadId").value;
  const data = {
    nombre: document.getElementById("f_nombre").value || null,
    telefono: document.getElementById("f_telefono").value || null,
    email: document.getElementById("f_email").value || null,
    isapre_actual: document.getElementById("f_isapre_actual").value || null,
    plan_actual: document.getElementById("f_plan_actual").value || null,
    precio_actual: parseFloat(document.getElementById("f_precio_actual").value) || null,
    cargas: parseInt(document.getElementById("f_cargas").value) || null,
    plan_tomado: document.getElementById("f_plan_tomado").value || null,
    valor_plan: parseFloat(document.getElementById("f_valor_plan").value) || null,
    fuente: document.getElementById("f_fuente").value,
    fecha_seguimiento: document.getElementById("f_fecha_seguimiento").value || null,
    clinica_preferente: document.getElementById("f_clinica_preferente").value || null,
    presupuesto: parseFloat(document.getElementById("f_presupuesto").value) || null,
    estado: document.getElementById("f_estado").value,
    notas: document.getElementById("f_notas").value || null,
  };
  if(id){
    await req(`leads?id=eq.${id}`, "PATCH", data);
    showToast("Lead actualizado");
  } else {
    await req("leads", "POST", data);
    showToast("Lead creado");
  }
  closeModal();
  await loadLeads();
}

async function deleteLead(){
  const id = document.getElementById("leadId").value;
  if(!id) return;
  if(!confirm("¿Eliminar este lead?")) return;
  await req(`leads?id=eq.${id}`, "DELETE");
  closeModal();
  await loadLeads();
  showToast("Lead eliminado");
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

loadLeads();
setInterval(loadLeads, 15000);
</script>
</body>
</html>
